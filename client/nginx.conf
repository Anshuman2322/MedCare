server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static SPA itself — helmet() on the API
    # (server/app.js) only covers JSON responses, not the HTML/JS/CSS
    # actually served to browsers from here.
    #
    # nginx rule: a location inherits these add_header lines only if it has no
    # add_header of its own. That is why the cache rules below use `expires`
    # and never add_header: otherwise this CSP and the other headers would be
    # silently dropped on exactly the responses that need them (the HTML).
    #
    # connect-src/img-src allow the API origin and Cloudinary; tighten
    # connect-src to the exact API domain once it's fixed for this
    # deployment instead of the broad "https:" fallback below.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed build assets — safe to cache for a year. ^~ keeps the
    # image rule below from taking over files inside /assets/.
    location ^~ /assets/ {
        expires 1y;
    }

    # Images in the site root (logo, hero, badges) keep their names between
    # releases, so cache them for a day rather than a year.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        expires 1d;
    }

    # React Router uses client-side routing; unknown paths must fall back to
    # index.html rather than 404ing, or a direct link to e.g. /shop breaks.
    # index.html itself must always be revalidated so a new release is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
